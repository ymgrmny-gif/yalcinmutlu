<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#080b10" />
  <title>Transdev Canlı Asistan</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">TRANSDEV • PRÜFPERSONAL</div>
        <h1>Canlı Asistan</h1>
      </div>
      <div id="status" class="status"><span class="dot"></span><span>Bağlanıyor</span></div>
    </header>

    <section class="live-panel">
      <div class="label">🇩🇪 GÖRÜŞMECİ</div>
      <div id="transcript" class="transcript muted">Konuşma bekleniyor…</div>
      <div class="divider"></div>
      <div class="label">🇹🇷 ANLAMI</div>
      <div id="translation" class="translation muted">—</div>
    </section>

    <section class="answer-card">
      <div class="answer-head">
        <span class="say-label">SÖYLE</span>
        <span id="source" class="source">—</span>
      </div>
      <div id="answer" class="answer muted">Soru anlaşılır anlaşılmaz kısa B1 cevap burada görünecek.</div>
      <div id="confidence" class="confidence"></div>
    </section>

    <footer>
      <span id="connection">Yerel bağlantı kuruluyor…</span>
      <span>Ses kaydı yok</span>
    </footer>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
