name: Transdev Listener Test

on:
  pull_request:
    paths:
      - 'tools/transdev-listener/**'
      - '.github/workflows/transdev-listener-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  listener-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check aiohttp numpy python-dotenv

      - name: Compile
        run: python -m py_compile tools/transdev-listener/app.py

      - name: Prepared-question matcher
        working-directory: tools/transdev-listener
        run: python app.py --self-test
